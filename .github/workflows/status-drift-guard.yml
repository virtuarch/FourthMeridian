name: STATUS drift guard

# Advisory tripwire for the failure mode documented in
# FOURTH_MERIDIAN_STATUS_DRIFT_INVESTIGATION_2026-07-13.md: initiatives shipping
# migrations / closeouts with NO STATUS.md update, leaving the ledger stale.
#
# It flags — it does not block. If a change set adds a prisma/migrations/
# folder or a docs/initiatives/** closeout without touching STATUS.md, this job
# emits a GitHub warning annotation + a step summary so the reviewer notices.
# It always exits 0 so it can never break the existing CI gate (ci.yml) or wedge
# a legitimately doc-exempt change. A maintainer who wants it to be blocking can
# flip the single `exit 0` at the end to `exit 1`.
#
# Two triggers (owner decision 2026-10-14, STATUS.md §13):
#   - pull_request: the change set is the PR diff against its base branch.
#   - push to develop (and v2.6 during its soak): the change set is everything
#     the push brought in, diffed
#     against the commit the branch pointed at before the push
#     (`github.event.before`). This repository has never used pull requests
#     (direct pushes to v2.6 are the real workflow), so until this trigger
#     existed the guard had never run. A brand-new branch or a force-push
#     whose `before` is unreachable falls back to the pushed HEAD's first
#     parent, and the summary says so.

on:
  pull_request:
  push:
    branches: ["develop", "v2.6"]  # v2.6: soak fallback only, remove at retirement

permissions:
  contents: read

jobs:
  status-drift-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Flag migrations/closeouts landing without a STATUS.md update
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # Resolve the comparison base for this event, and describe it.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=200 origin "$PR_BASE_REF"
            BASE="origin/${PR_BASE_REF}"
            RANGE="${BASE}...HEAD"
            DESCRIBE="pull request against ${PR_BASE_REF}"
          else
            if [ -n "$PUSH_BEFORE" ] \
               && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              BASE="$PUSH_BEFORE"
              DESCRIBE="push, compared with the previous branch tip ${PUSH_BEFORE:0:7}"
            else
              BASE="HEAD~1"
              DESCRIBE="push with no reachable previous tip (new branch or force-push); compared with HEAD~1 only"
            fi
            RANGE="${BASE} HEAD"
          fi

          # Files changed by this change set.
          # shellcheck disable=SC2086
          CHANGED="$(git diff --name-only $RANGE)"

          # Did the change set touch STATUS.md at all?
          if echo "$CHANGED" | grep -qx 'STATUS.md'; then
            echo "STATUS.md was updated in this change set (${DESCRIBE}) — no drift flag." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Ledger-relevant changes that should almost always come with a STATUS.md edit:
          #  - a new/changed Prisma migration (schema-owning work)
          #  - a docs/initiatives/** closeout or completion record
          TRIGGERS="$(echo "$CHANGED" | grep -E \
            -e '^prisma/migrations/' \
            -e '^docs/initiatives/.*(CLOSEOUT|COMPLETION|RATIFICATION|_CLOSEOUT_).*\.md$' \
            || true)"

          if [ -z "$TRIGGERS" ]; then
            echo "No migration/closeout changes detected (${DESCRIBE}) — no drift flag." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### ⚠️ STATUS.md drift guard"
            echo ""
            echo "This change set (${DESCRIBE}) changes migration/closeout files but does **not** touch \`STATUS.md\`."
            echo "Per the maintenance rule, initiative work updates the ledger (or the commit states why not)."
            echo ""
            echo "Ledger-relevant files changed here:"
            echo ""
            echo '```'
            echo "$TRIGGERS"
            echo '```'
            echo ""
            echo "_Advisory only — this check does not block._"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::warning title=STATUS.md not updated::This change set adds migrations/closeouts without a STATUS.md diff — update the ledger or note in the commit why not."

          # Advisory: never fail the build. Flip to `exit 1` to make it blocking.
          exit 0
